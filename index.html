<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A classic Snake game built on HTML canvas." />
    <title>Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <h1>Snake</h1>
        <div class="scores">
          <span>Score <strong id="score">0</strong></span>
          <span>Best <strong id="best">0</strong></span>
        </div>
      </header>

      <div class="board">
        <canvas id="board" width="440" height="440" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay" hidden>
          <h2 id="overlay-title"></h2>
          <p id="overlay-text"></p>
          <button id="overlay-button" type="button">Play</button>
        </div>
      </div>

      <p class="help">
        Arrow keys or WASD to steer · Space to pause · Swipe on touch devices
      </p>
    </main>

    <script type="module" src="src/ui.js"></script>
  </body>
</html>
